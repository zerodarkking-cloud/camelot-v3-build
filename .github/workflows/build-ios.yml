# Сборка iOS-приложения без Mac: GitHub собирает ядро sing-box и приложение на своём macOS,
# подписывает ldid с VPN-entitlements и выкладывает .tipa для TrollStore в Releases.
name: Build iOS (TrollStore)

on:
  push:
    branches: [main, ios-tunnel]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n1)"
          xcodebuild -version

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Restore Libbox cache
        id: libbox-cache
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-v1.14.4-ios-${{ hashFiles('scripts/build-libbox.sh') }}

      - name: Build Libbox (sing-box core)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          if ! PLATFORM=ios ./scripts/build-libbox.sh > build/libbox.log 2>&1; then
            ./scripts/ci-annotate.sh "libbox" build/libbox.log
            tail -n 80 build/libbox.log
            exit 1
          fi
          tail -n 5 build/libbox.log

      # Сохраняем ядро сразу, чтобы следующая сборка не тратила на него 7 минут, даже если дальше что-то упадёт.
      - name: Save Libbox cache
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-v1.14.4-ios-${{ hashFiles('scripts/build-libbox.sh') }}

      - name: Tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (without signing)
        run: |
          mkdir -p build
          set +e
          xcodebuild \
            -project CamelotTunnel.xcodeproj \
            -target CamelotTunnel \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build/sym" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1
          code=$?
          set -e
          APP=build/sym/Release-iphoneos/CamelotTunnel.app
          if [ $code -ne 0 ] || [ ! -f "$APP/CamelotTunnel" ] || [ ! -f "$APP/PlugIns/TunnelExtension.appex/TunnelExtension" ]; then
            ./scripts/ci-annotate.sh "xcodebuild" build/xcodebuild.log '(error|fatal):|Undefined symbol|referenced from|^ld: |duplicate symbol|^ +"_|^ +_[A-Za-z]'
            grep -B 40 -E '(error|fatal):' build/xcodebuild.log | head -n 120 || tail -n 80 build/xcodebuild.log
            exit 1
          fi
          grep -E 'BUILD SUCCEEDED' build/xcodebuild.log

      - name: Package .tipa
        run: |
          if ! ./scripts/package-tipa.sh build/sym/Release-iphoneos/CamelotTunnel.app dist > build/package.log 2>&1; then
            ./scripts/ci-annotate.sh "package" build/package.log
            cat build/package.log
            exit 1
          fi
          cat build/package.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamelotTunnel-tipa
          path: dist/*.tipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CamelotTunnel build ${{ github.run_number }}
          prerelease: true
          files: dist/*.tipa
          body: |
            Установка: скачайте .tipa на iPhone (Safari) → «Поделиться» → TrollStore → Install.
            Ядро sing-box v1.14.4, MTU 1280, IPv4 + IPv6.
